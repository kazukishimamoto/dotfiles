name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 毎月 1 日 00:00 UTC（日本時間 9:00）。まっさらな Mac で通るかを定期的に確かめる
    - cron: '0 0 1 * *'

jobs:
  # install は設定ファイルを配置するだけなので、Homebrew も macOS も要らない。
  # 数十秒で終わるため、毎 push でここが落ちれば早い段階で気づける。
  links:
    name: 設定ファイルの配置を確認する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: サンドボックスで install を実行する
        run: ./test-install

  # macOS ランナーは毎回まっさらな Mac なので、
  # 「新しい Mac を買ったときに README の手順どおりで動くか」をここで確認する。
  # 自分の Mac から Homebrew を消して試す代わりになる。
  #
  # 毎 push で知りたい情報ではないうえ、macOS ランナーは待たされることがあるため、
  # 手動実行（gh workflow run check.yml）と月 1 回の定期実行に限定する。
  fresh-mac:
    name: まっさらな Mac で通しで確認する
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: サンドボックスで install を実行する
        run: ./test-install

      - name: Brewfile のツールを入れる（README の手順 3）
        run: brew bundle --file=Brewfile

      - name: Brewfile に書いたものが全部入ったか確認する
        run: brew bundle check --file=Brewfile

      - name: 設定ファイルを配置する（README の手順 4）
        run: DOTFILES="$PWD" ./install

      - name: 新しいシェルが起動して主要コマンドが使えるか確認する
        run: |
          zsh -l -i -c '
            ng=0
            for c in starship eza bat fzf gh direnv fnm tmux; do
              if command -v "$c" > /dev/null; then
                echo "  OK   $c"
              else
                echo "  NG   $c が見つかりません"
                ng=1
              fi
            done
            chk() {
              if eval "$2"; then
                echo "  OK   $1"
              else
                echo "  NG   $1"
                ng=1
              fi
            }
            chk "ll のエイリアスが定義されている"   "alias ll > /dev/null 2>&1"
            chk "gtop が呼び出し時に評価される"     "alias gtop | grep -q rev-parse"
            chk "補完が初期化されている"           "(( ${+_comps} )) && (( ${#_comps} > 100 ))"
            chk "fzf の Ctrl-T が使える"           "bindkey | grep -q \"\\^T.*fzf\""
            chk "fzf の Alt-C が使える"            "bindkey | grep -qi fzf-cd"
            chk "Ctrl-R が割り当てられている"      "bindkey | grep -q \"\\^R\""
            chk "Ctrl-K が kill-line"              "bindkey | grep -q \"\\^K.*kill-line\""
            chk "履歴の共有が有効"                 "[[ -o share_history ]]"
            # VS Code が無い環境では VISUAL=vim になるのが正しい挙動なので、条件分岐そのものを確認する
            chk "VISUAL が正しく設定されている"    "if (( \$+commands[code] )); then [[ \$VISUAL == *--wait* ]]; else [[ -n \$VISUAL ]]; fi"
            echo "  補完定義の数: ${#_comps}"
            exit $ng
          ' < /dev/null
